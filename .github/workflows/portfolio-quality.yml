name: Portfolio Quality Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ai-control-room-2026]
permissions:
  contents: read
jobs:
  web-build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
  researchguard-tests:
    name: ResearchGuard stdlib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s labs/researchguard -p 'test_*.py' -v
